name: Deploy to GitHub Pages

on:
  push: {}
  schedule:
    # 22:00 UTC is 06:00 the following day in Asia/Shanghai.
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      initialize:
        description: '首次接入：线上尚无 Notion 发布清单时允许初始化'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    # Publish only the repository's default branch, including manual runs.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@v6

      - name: Install, sync, check, build, and upload complete site
        uses: withastro/action@v6
        with:
          node-version: '24'
          package-manager: pnpm@12.4.1
          build-cmd: pnpm run notion:publish
          out-dir: .artifacts/notion-published/site
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          SITE_BASE: ${{ steps.pages.outputs.base_path || '/' }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ vars.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ vars.NOTION_DATA_SOURCE_ID }}
          NOTION_INITIALIZE: ${{ github.event_name == 'workflow_dispatch' && inputs.initialize && 'true' || 'false' }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v5
